<svg width="200" height="80" viewBox="0 0 200 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Lightning bolt / Figure -->
  <g transform="translate(20, 10)">
    <!-- Head -->
    <circle cx="25" cy="8" r="6" fill="#4A5568"/>
    
    <!-- Body/Lightning -->
    <path d="M20 15 L30 15 L25 25 L35 25 L20 45 L25 30 L18 30 Z" fill="#4FD1C7"/>
    
    <!-- Nike-like swoosh -->
    <path d="M35 20 Q45 15 50 25" stroke="#4A5568" stroke-width="3" fill="none"/>
  </g>
  
  <!-- Text -->
  <g transform="translate(10, 45)">
    <!-- SCIENCE -->
    <text x="0" y="15" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#4A5568">
      SCIENCE
    </text>
    
    <!-- IN MOTION -->
    <text x="0" y="32" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#4FD1C7">
      IN MOTION
    </text>
  </g>
</svg>